<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Use cases</title>
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="wrap site-title">
    <h1>Use cases</h1>
  </header>
  <div class="tabs-bar">
    <div class="wrap tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" id="tab-top" data-tab="top" aria-controls="panel-top" aria-selected="true">Top 15</button>
      <button type="button" role="tab" id="tab-posts" data-tab="posts" aria-controls="panel-posts" aria-selected="false" tabindex="-1">Posts</button>
      <button type="button" role="tab" id="tab-topic" data-tab="topic" aria-controls="panel-topic" aria-selected="false" tabindex="-1" hidden>Topic</button>
      <button type="button" role="tab" id="tab-saved" data-tab="saved" aria-controls="panel-saved" aria-selected="false" tabindex="-1">Saved</button>
    </div>
  </div>
  <main class="wrap" id="main">
    <p id="empty" class="empty" hidden>No data yet</p>
    <ul id="legend" class="legend" hidden></ul>

    <section id="panel-top" role="tabpanel" aria-labelledby="tab-top" tabindex="0">
      <div id="product-filter" class="segment" role="radiogroup" aria-label="Product"></div>
      <p id="caption" class="caption"></p>
      <div id="chart" class="chart">
        <p id="chart-empty" class="chart-empty" hidden>None</p>
      </div>
      <div class="scrub">
        <button type="button" id="play" aria-pressed="false">Play</button>
        <input id="date" type="range" min="0" max="0" step="1" value="0" aria-label="Date">
        <span id="date-label" class="scrub-date"></span>
      </div>
    </section>

    <section id="panel-posts" role="tabpanel" aria-labelledby="tab-posts" tabindex="0" hidden>
      <p id="posts-empty" class="empty" hidden>No data yet</p>
      <div class="filters" id="posts-tools">
        <label>Platform
          <select id="f-platform"></select>
        </label>
        <label>Product
          <select id="f-product"></select>
        </label>
        <label>Use case
          <select id="f-use"></select>
        </label>
        <label>Quote
          <input id="f-q" type="search" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <p id="match-count" class="count" aria-live="polite"></p>
      <div class="table-wrap" id="posts-table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col" data-sort="date" aria-sort="descending"><button type="button">Date</button></th>
              <th scope="col" data-sort="platform" aria-sort="none"><button type="button">Platform</button></th>
              <th scope="col" data-sort="product" aria-sort="none"><button type="button">Product</button></th>
              <th scope="col" data-sort="use" aria-sort="none"><button type="button">Use case</button></th>
              <th scope="col">Quote</th>
              <th scope="col">Link</th>
              <th scope="col">Save</th>
            </tr>
          </thead>
          <tbody id="posts-body"></tbody>
        </table>
      </div>
      <div id="pager" class="pager" hidden>
        <button type="button" id="prev">Previous</button>
        <span id="page-label" class="page-label"></span>
        <button type="button" id="next">Next</button>
      </div>
    </section>

    <section id="panel-topic" role="tabpanel" aria-labelledby="tab-topic" tabindex="0" hidden>
      <h2 id="topic-title"></h2>
      <p id="topic-meta" class="caption"></p>
      <div id="topic-board" class="board"></div>
      <p id="topic-empty" class="empty" hidden>No posts</p>
      <p id="topic-more" class="topic-more"><a id="topic-all" href="#posts">All posts</a></p>
    </section>

    <section id="panel-saved" role="tabpanel" aria-labelledby="tab-saved" tabindex="0" hidden>
      <h2>Saved</h2>
      <p id="saved-meta" class="caption"></p>
      <div class="saved-find" id="saved-tools">
        <label>Find
          <input id="saved-q" type="search" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <div id="saved-list" class="saved-list"></div>
      <p id="saved-empty" class="empty" hidden>No saved posts</p>
    </section>
  </main>

  <dialog id="save-dialog" aria-labelledby="save-heading">
    <form id="save-form">
      <h2 id="save-heading">Save post</h2>
      <p id="save-quote" class="save-quote"></p>
      <label>Highlight
        <input id="save-highlight" type="text" autocomplete="off" spellcheck="false" maxlength="500">
      </label>
      <p class="save-hint">Select a passage in the quote, or type one.</p>
      <label>Note
        <textarea id="save-note" rows="3" maxlength="2000" placeholder="Why this is worth keeping"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" id="save-remove">Remove</button>
        <button type="button" id="save-cancel">Cancel</button>
        <button type="submit" id="save-confirm">Save</button>
      </div>
    </form>
  </dialog>

  <noscript>JavaScript is required.</noscript>
  <script src="js/app.js"></script>
</body>
</html>
